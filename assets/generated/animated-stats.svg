        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0s" fill="freeze"/>
      </text>
      <text x="20" y="64" class="dim" font-size="13">Repositories</text>
      <text x="20" y="84" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">no change this month</text>
    </g>
    <g transform="translate(502,14)">
      <rect class="card-bg" width="230" height="96" rx="12"/>
      <text x="20" y="38" class="num" font-size="30" fill="#00E0FF">
        1,888
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0s" fill="freeze"/>
      </text>
