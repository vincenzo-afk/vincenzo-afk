<svg xmlns="http://www.w3.org/2000/svg" width="700" height="180" viewBox="0 0 700 180">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E0FF"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
    <style>
      .card-bg { fill: #111826; stroke: #1f2937; stroke-width: 1; }
      .title { fill: #c9d1d9; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; }
      .dim { fill: #8b949e; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .accent { fill: #00E0FF; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; }
      .num { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; }
      text { dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="700" height="180" fill="#0d1117"/>
  
  
    <rect class="card-bg" x="10" y="10" width="680" height="160" rx="14"/>
    <text x="34" y="40" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="14" fill="#7ee787">🟢 NOW BUILDING</text>
    <text x="34" y="68" class="title" font-size="22">🧠 NOVA</text>
    <text x="34" y="90" class="dim" font-size="12">In Active Development</text>

    <rect x="34" y="104" width="632" height="14" rx="7" fill="#1c2333"/>
    <rect x="34" y="104" width="455" height="14" rx="7" fill="url(#glow)"/>
    <text x="34" y="136" class="dim" font-size="11">Progress</text>
    <text x="666" y="136" text-anchor="end" class="accent" font-size="12">72%</text>

    <text x="34" y="160" class="dim" font-size="11">Current Module:</text>
